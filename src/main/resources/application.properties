spring.application.name=retail-store-modulith

# Liquibase
spring.liquibase.change-log=classpath:/db/changelog/db.changelog-master.xml
spring.liquibase.enabled=true
# Sample data must be explicitly enabled in local/test environments.
spring.liquibase.contexts=!sample-data

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=public

# RabbitMQ
spring.rabbitmq.publisher-confirm-type=correlated

# Modulith
spring.modulith.events.republish-outstanding-events-on-restart=true
spring.modulith.events.externalization.mode=outbox
spring.modulith.events.completion-mode=archive